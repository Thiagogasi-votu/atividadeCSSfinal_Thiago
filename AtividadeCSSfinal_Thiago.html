<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade final</title>
    <style>
        * {
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            text-align: center;
        }

        img {
            width: 300px;
            height: 200px;
        }

        #type1 {
            color: salmon
        }

        #type2 {
            background-color: lightskyblue;
        }

        #type3 {
            color: magenta;
            font-family: 'times new roman';
        }

        #type4 {
            color: rgb(40, 218, 23);
            text-decoration: underline;
            font-family: 'times new roman';
        }

        .borda {
            border: 1px solid yellowgreen;
        }

        #type5 {
            color: orangered;
            font-family: 'verdana', 'geneva', 'tahoma', 'sans-serif';
            font-size: 70px;
            text-decoration: underline;
            background-color: purple;
        }
    </style>
</head>

<body>
    <h1>PÁGINA TESTE CSS</h1>
    <hr>
    <img src="_image/css01.jpg"></img>
    <img src="_image/css02.jpg"></img>
    <img src="_image/css03.jpg"></img>
    <img src="_image/css04.png"></img>
    <hr>
    <h2 id="type1">CSS È VIDA!</h2>
    <p>Diversas possibilidades de incrementar seu HTML</p>
    <h1>Exemplo de Cores no CSS</h1>
    <p id="type2"><b>Exemplo de Texto com cor de fundo</b></p>
    <hr>
    <p id="type3"><b><i>Exemplo de Texto com mudança da cor da fonte</i></b></p>
    <hr>
    <p class="borda">Exemplo de texto com borda colorida</p>
    <h1>Misturando Tudo</h1>
    <p class="borda" id="type4"><b>Exemplo de texto com várias formatações</b></p>
    <hr>
    <p id="type5"><b><i>Mais em exemplo</i></b></p>

</html>
